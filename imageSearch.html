<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Image Search</title>
</head>
<body>
    <header class="top-bar">
        <a href="index.html">Google Search</a>
    </header>

    <main class="centered">
        <h1 class="google-logo" aria-label="Google">
            <span class="logo-letter blue">G</span>
            <span class="logo-letter red">o</span>
            <span class="logo-letter yellow">o</span>
            <span class="logo-letter blue">g</span>
            <span class="logo-letter green">l</span>
            <span class="logo-letter red">e</span>
        </h1>
        <p class="page-note">Image Search</p>
        <form class="search-form" action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Search Images..." required>
            <input type="hidden" name="tbm" value="isch">
            <div class="buttons">
                <input type="submit" value="Search Images">
            </div>
        </form>
    </main>
</body>
</html>
